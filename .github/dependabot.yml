version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /
      - /netunim-kupa/bank-bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      # camoufox-js 0.13.0 requires playwright-core <1.63.0. Review together.
      - dependency-name: playwright-core
        versions: [">=1.63.0"]
      # TypeScript 7 removes the JS compiler API used by isolated handler tests.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      compatible-version-updates:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch, minor]
      compatible-security:
        applies-to: security-updates
        update-types: [patch, minor]
