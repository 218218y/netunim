version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /
      - /netunim-kupa/bank-bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-security:
        applies-to: security-updates
        update-types: [patch, minor]
