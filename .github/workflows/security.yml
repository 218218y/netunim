name: Security verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Redacted secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed history without publishing secret values
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts="--all" --report-format=json --report-path="$RUNNER_TEMP/gitleaks-redacted.json" --no-banner .'
      - name: Preserve only redacted scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: redacted-secret-scan
          path: ${{ runner.temp }}/gitleaks-redacted.json
          retention-days: 7

  dependencies:
    name: Locked dependency audit and Chromium compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Audit both lockfiles (high or critical findings block release)
        run: |
          npm audit --audit-level=high
          npm audit --prefix netunim-kupa/bank-bridge --audit-level=high
      - name: Install only locked bank dependencies without lifecycle scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --prefix netunim-kupa/bank-bridge --ignore-scripts --no-audit --no-fund
      - name: Exercise actual scraper and Puppeteer packages against isolated Chromium
        run: NETUNIM_BROWSER="$(command -v google-chrome)" node tests/runtime_bank_dependencies.mjs

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:${{ matrix.language }}
          output: .work/codeql
      - name: Block high and critical security findings
        run: python tools/security_codeql_gate.py .work/codeql
