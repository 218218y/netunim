name: Full verification

# Every push (including tags), PR merge candidate and merge-queue candidate.
# No path filters and no cancellation of older pushes: every pushed version runs.
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    name: Plan verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build matrix from the canonical local suite inventory
        id: plan
        run: echo "matrix=$(python3 tests/run_all.py --ci-matrix)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify / ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install locked verification dependencies without cross-run caches
        run: |
          npm ci --cache "$RUNNER_TEMP/netunim-npm-cache" --ignore-scripts --no-audit --no-fund
          python -m pip install --no-cache-dir -r tests/requirements-ci.txt
      - name: Install PostgreSQL 18 for the current migration contract
        if: matrix.postgres
        run: |
          # Configure the official signed PGDG repository explicitly: runner images
          # retain PostgreSQL 16 binaries but may remove their build-time APT source.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/netunim-pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/postgres --version
      - name: Locate the runner's real Chrome browser
        if: matrix.browser
        run: |
          browser_path="$(command -v google-chrome)"
          "$browser_path" --version
          echo "NETUNIM_BROWSER=$browser_path" >> "$GITHUB_ENV"
      - name: Run every suite in this group
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        run: python tests/run_all.py --group "$VERIFY_GROUP" --keep-going --report-dir ".work/ci/$VERIFY_GROUP"
      - name: Preserve test logs and timing reports even after failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.group }}
          path: |
            .work/ci/${{ matrix.group }}/
            .work/performance/latest.json
            .work/storage-performance/latest.json
            .work/startup-performance/latest.json
            .work/loaded-performance/latest.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows deployment contracts
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Exercise actual cmd.exe entrypoints with isolated upload stubs
        # Includes staged DPAPI/native provider stubs and real Chromium
        # restore/PWA scenarios; global installers and real providers stay off.
        # The same locked dependencies support the existing browser harness.
        # No external account, browser profile or installed Bridge is reused.
        run: |
          npm ci --cache "$env:RUNNER_TEMP/netunim-npm-cache" --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-cache-dir -r tests/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_deploy_contracts.py
      - name: Exercise Windows parallel scheduling and process cleanup
        run: python tests/runner_contracts.py
      - name: Exercise staged asset hooks and captured Git objects on Windows
        run: python tests/sync_assets_contracts.py StagedAssetContracts
      - name: Preserve isolated Windows acceptance logs and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-isolated-acceptance
          path: .work/ci/windows-acceptance/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  supabase:
    name: Full Supabase acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.121.0
      - name: Install locked browser dependencies
        run: |
          python -m pip install --no-cache-dir -r tests/requirements-ci.txt
          browser_path="$(command -v google-chrome)"
          echo "NETUNIM_BROWSER=$browser_path" >> "$GITHUB_ENV"
      - name: Exercise the actual disposable Supabase services
        env:
          NETUNIM_SUITE_REPORT_DIR: .work/ci/full-supabase
        run: python tests/runtime_supabase_stack.py
      - name: Preserve credential-free service and restart evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-supabase-acceptance
          path: .work/ci/full-supabase/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  complete:
    name: Verification complete
    if: always()
    needs: [plan, verify, windows, supabase]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every group and Windows deployment contracts to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
        run: |
          printf 'Plan: %s\nSuites: %s\nWindows: %s\n' "$PLAN_RESULT" "$VERIFY_RESULT" "$WINDOWS_RESULT"
          test "$PLAN_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$SUPABASE_RESULT" = success
