<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ניהול קופה</title>
<meta name="kupa-build" content="kupa-public-data-free-v1" />
<meta name="theme-color" content="#f7f8f6" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/x-icon" href="./favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
<link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="ניווט ראשי" aria-hidden="false">
    <div class="brand"><h1>ניהול קופה</h1></div>
    <nav class="nav" id="nav">
      <button data-page="dashboard"><span class="ico">⌂</span> לוח בקרה</button>
      <button data-page="checks" class="active"><span class="ico">✓</span> צקים</button>
      <button data-page="credit"><span class="ico">▣</span> הוצאות</button>
      <button data-page="cash"><span class="ico">₪</span> מזומן</button>
      <button data-page="bank"><span class="ico">▤</span> בנק</button>
      <button data-page="notes"><span class="ico">✎</span> הערות</button>
      <button data-page="settings"><span class="ico">⚙</span> הגדרות וגיבוי</button>
    </nav>
  </aside>
  <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="סגור תפריט" tabindex="-1"></button>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <button class="btn mobile-menu" id="mobileMenu" type="button" aria-label="פתח תפריט" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="topbar-heading"><h2 id="pageTitle">צקים</h2><div class="sub" id="pageSub"></div></div>
        <button class="global-search-trigger" id="globalSearchButton" type="button" aria-label="חיפוש בכל נתוני הקופה" aria-haspopup="dialog" aria-expanded="false" title="חיפוש בכל הקופה (Ctrl+K)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/></svg><span>חיפוש</span></button>
      </div>
      <div class="top-actions">
        <span class="cloud-head-status hide-mobile" id="cloudHeaderStatus" title="מצב סנכרון ענן"><i></i> ענן: לא מחובר</span><span class="file-status off hide-mobile" id="dbStatus"><i></i> קובץ לא נבחר</span><span class="save-indicator hide-mobile" id="saveIndicator"></span><button class="btn hide-mobile" id="backupTop">גיבוי עכשיו</button>
        <button class="btn primary" id="quickAddCheck">+ צק חדש</button>
      </div>
    </header>
    <div class="page" id="content"></div>
  </main>
</div>

<div class="global-search-backdrop" id="globalSearchBackdrop" hidden aria-hidden="true">
  <section class="global-search-dialog" role="dialog" aria-modal="true" aria-labelledby="globalSearchTitle">
    <div class="global-search-head">
      <div><h2 id="globalSearchTitle">חיפוש בכל הקופה</h2><span id="globalSearchMeta">כל נתוני הקופה במקום אחד</span></div>
      <button class="global-search-close" id="globalSearchClose" type="button" aria-label="סגור חיפוש">×</button>
    </div>
    <label class="global-search-input-wrap" for="globalSearchInput">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/></svg>
      <input id="globalSearchInput" type="search" autocomplete="off" placeholder="צ׳ק, אשראי, הוצאה, בנק, מזומן, הערה…">
      <kbd>Ctrl K</kbd>
    </label>
    <div class="global-search-results" id="globalSearchResults"></div>
  </section>
</div>

<div class="connect-screen" id="connectScreen">
  <div class="connect-card">
    <div class="connect-logo">₪</div>
    <h2 id="connectTitle">פותח את קופת העסק…</h2>
    <p id="connectText">בודק אם קיימת תיקיית קופה שמורה ומנסה להתחבר אליה אוטומטית.</p>
    <div class="connect-actions" id="connectActions" style="display:none">
      <button class="btn primary" id="openLastFolder" style="display:none">פתח קופה שמורה</button>
      <button class="btn primary" id="chooseFolder" style="display:none">בחר תיקיית קופה</button>
      <button class="btn" id="chooseDataFile" style="display:none">בחר קובץ נתונים</button>
      <button class="btn" id="openCloud" style="display:none">פתח קופה מהענן</button>
    </div>
    <div class="connect-note" id="connectNote">הנתונים נשמרים בקובץ שבתיקיית הקופה, לא בזיכרון הדפדפן.</div>
  </div>
</div>
<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="confirm-backdrop" id="confirmBackdrop" aria-hidden="true"><div class="confirm-dialog" id="confirmDialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage"><div class="confirm-icon" id="confirmIcon" aria-hidden="true">!</div><h3 class="confirm-title" id="confirmTitle">אישור פעולה</h3><p class="confirm-message" id="confirmMessage"></p><div class="confirm-actions"><button class="btn danger" id="confirmAccept" type="button">אישור</button><button class="btn" id="confirmCancel" type="button">ביטול</button></div></div></div>
<div class="toast" id="toast"></div><input id="legacyFileInput" type="file" accept="application/json,.json" hidden>
<script type="module" src="./assets/app.js"></script>

</body>
</html>
