function triSelect(id,label,val,na=true){return `<div class="field"><label>${label}</label><select id="${id}">${na?`<option value="null" ${val==null?'selected':''}>לא רלוונטי</option>`:''}<option value="true" ${val===true?'selected':''}>כן</option><option value="false" ${val===false?'selected':''}>לא</option></select></div>`}
function parseTri(id){const v=$('#'+id).value;return v==='true'?true:v==='false'?false:null}
function openTransactionModal(id=null,supplierId=null,insertAfterId=null){
  const t=id?state.transactions.find(x=>x.id===id):null;
  const anchor=insertAfterId?state.transactions.find(x=>x.id===insertAfterId):null;
  const sid=t?.supplierId||anchor?.supplierId||supplierId||currentSupplierId||state.suppliers[0]?.id||'';
  const opts=state.suppliers.map(s=>`<option value="${esc(s.id)}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('');
  const positionNotice=!t&&anchor?`<div class="field full"><div class="notice">התנועה תתווסף <b>מיד אחרי שורה ${esc(anchor.sequence)}</b>. שאר השורות ימוספרו מחדש אוטומטית, והיתרות יחושבו מחדש.</div></div>`:'',yearNotice=t&&validSupplierYear(t.yearEnd)!==null?`<div class="field full"><div class="notice">שורה זו מסומנת כ<b>סוף שנה ${esc(t.yearEnd)}</b>. כדי להעביר אותה לספק אחר יש להסיר קודם את סימון סוף השנה דרך מצב “בחירה”.</div></div>`:'';
  modal(t?'עריכת תנועה':anchor?'הוספת תנועה באמצע הכרטיס':'תנועה חדשה',`<div class="form-grid"><div class="field full"><label>ספק</label><select id="fSupplier" ${anchor||validSupplierYear(t?.yearEnd)!==null?'disabled':''}>${opts}</select></div>${positionNotice}${yearNotice}<div class="field full"><label>פעולה</label><input id="fAction" value="${esc(t?.action||'')}" placeholder="לדוגמה: הזמנה 1234 / תשלום"></div><div class="field"><label>סכום חובה</label><input id="fDebit" class="number-input" type="number" step="1" value="${Number(t?.debit||0)||''}"></div><div class="field"><label>סכום זכות</label><input id="fCredit" class="number-input" type="number" step="1" value="${Number(t?.credit||0)||''}"></div>${triSelect('fInvoice','חשבונית התקבלה',t?.invoiceReceived??false,true)}${triSelect('fSigned','חתום',t?.signed??false,true)}${triSelect('fSupplied','סופק',t?.supplied??false,true)}<div class="field"><label>זמן / פרטי אספקה</label><input id="fSupplyInfo" value="${esc(t?.supplyInfo||'')}" placeholder="תאריך, שבוע, הערה…"></div><div class="field"><label>ח״מ יצא</label><select id="fHm"><option value="false" ${!t?.hmIssued?'selected':''}>לא</option><option value="true" ${t?.hmIssued?'selected':''}>כן</option></select></div><div class="field full"><label>הערה</label><textarea id="fNote">${esc(t?.note||'')}</textarea></div>${t?.source?`<div class="field full"><div class="notice">מקור: ${esc(t.source.sheet)} · שורה ${esc(t.source.row)}. עריכה כאן אינה משנה את קובץ האקסל המקורי.</div></div>`:''}</div>`,`<button class="btn primary" onclick="saveTransaction('${id||''}','${insertAfterId||''}')">שמור</button>${t?`<button class="btn danger" onclick="deleteTransaction('${esc(t.id)}')">מחק תנועה</button>`:''}<button class="btn" onclick="closeModal()">ביטול</button>`)
}
function saveTransaction(id,insertAfterId=''){
  const existing=id?state.transactions.find(x=>x.id===id):null;
  const oldSupplierId=existing?.supplierId||null;
  const supplierId=$('#fSupplier').value,action=$('#fAction').value.trim(),debit=Math.max(0,Number($('#fDebit').value||0)),credit=Math.max(0,Number($('#fCredit').value||0));
  if(!supplierId)return toast('יש לבחור ספק');
  if(!action&&!debit&&!credit)return toast('יש להזין פעולה או סכום');
  if(debit&&credit&&!confirm('הוזנו גם חובה וגם זכות באותה תנועה. לשמור כך?'))return;
  const row={...(existing||{}),id:existing?.id||uid(),supplierId,sequence:existing?.sequence||0,kind:debit?'חיוב':credit?'זיכוי/תשלום':'הערה',action,debit,credit,invoiceReceived:parseTri('fInvoice'),signed:parseTri('fSigned'),supplied:parseTri('fSupplied'),supplyInfo:$('#fSupplyInfo').value.trim(),hmIssued:$('#fHm').value==='true',note:$('#fNote').value.trim(),updatedAt:new Date().toISOString()};
  if(existing){
    Object.assign(existing,row);
    if(oldSupplierId!==supplierId){resequenceSupplier(oldSupplierId);insertTransactionAfter(existing,supplierId,null)}
  }else{
    state.transactions.push(row);
    insertTransactionAfter(row,supplierId,insertAfterId||null)
  }
  currentSupplierId=supplierId;closeModal();scheduleSave(existing?'התנועה עודכנה':insertAfterId?'התנועה נוספה במיקום שבחרת':'התנועה נוספה');if(currentView==='supplier')renderSupplier({scrollMode:(!existing&&!insertAfterId)?'end':'preserve'});else render()
}
function deleteTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;if(validSupplierYear(t.yearEnd)!==null)return toast(`יש להסיר קודם את סימון סוף שנה ${t.yearEnd} מהשורה`);if(!confirm('למחוק את התנועה? היתרות יחושבו מחדש אוטומטית.'))return;const sid=t.supplierId;state.transactions=state.transactions.filter(x=>x.id!==id);resequenceSupplier(sid);closeModal();scheduleSave('התנועה נמחקה');if(currentView==='supplier')renderSupplier({scrollMode:'preserve'});else render()}
function openSelectedSupplierEditor(){const id=$('#settingsSupplierEdit')?.value;if(!id)return toast('יש לבחור ספק לעריכה');openSupplierModal(id)}
function openSupplierModal(id=null){const s=id?state.suppliers.find(x=>x.id===id):null;modal(s?'עריכת ספק':'ספק חדש',`<div class="form-grid"><div class="field full"><label>שם ספק</label><input id="sName" value="${esc(s?.name||'')}"></div><div class="field full"><label>הערה</label><input id="sNote" value="${esc(s?.note||'')}"></div></div>`,`<button class="btn primary" onclick="saveSupplier('${id||''}')">שמור</button><button class="btn" onclick="closeModal()">ביטול</button>`)}
function saveSupplier(id){const name=$('#sName').value.trim();if(!name)return toast('יש להזין שם ספק');let s=id?state.suppliers.find(x=>x.id===id):null;if(s){s.name=name;s.note=$('#sNote').value.trim()}else{const nextOrder=state.suppliers.reduce((m,x)=>Math.max(m,supplierSortValue(x)),-1)+1;s={id:uid('SUP'),name,note:$('#sNote').value.trim(),active:true,sortOrder:nextOrder};state.suppliers.push(s);currentSupplierId=s.id}closeModal();scheduleSave(s?'הספק נשמר':'הספק נוסף');render()}
function customerDebtStatus(d){if(d.paid&&d.invoiceIssued)return{key:'closed',text:'נסגר',cls:'green'};if(d.paid&&!d.invoiceIssued)return{key:'invoice',text:'שולם · חסרה חשבונית',cls:'red'};if(!d.paid&&d.invoiceIssued)return{key:'open',text:'חשבונית יצאה · טרם שולם',cls:'yellow'};return{key:'open',text:'חוב פתוח',cls:'yellow'}}
function customerStats(){const rows=state.customerDebts||[];return{openTotal:rows.filter(d=>!d.paid).reduce((s,d)=>s+Number(d.amount||0),0),allTotal:rows.reduce((s,d)=>s+Number(d.amount||0),0),open:rows.filter(d=>!d.paid).length,missingInvoice:rows.filter(d=>d.paid&&!d.invoiceIssued).length,closed:rows.filter(d=>d.paid&&d.invoiceIssued).length,trackedOrders:(state.customerOrders||[]).length}}
function setCustomerTab(tab){if(!['debts','orders'].includes(tab)||tab===customerTab)return;customerTab=tab;customerBulkSelected.clear();renderCustomers()}
function customerBulkSource(){return customerTab==='debts'?(state.customerDebts||[]):(state.customerOrders||[])}
function customerVisibleBulkIds(){return [...document.querySelectorAll('[data-customer-bulk-id]')].map(el=>el.dataset.customerBulkId).filter(Boolean)}
function toggleCustomerBulkMode(){customerBulkMode=!customerBulkMode;customerBulkSelected.clear();renderCustomers()}
function toggleCustomerBulkRow(id,checked){if(!customerBulkMode)return;if(!customerBulkSource().some(x=>x.id===id))return;if(checked)customerBulkSelected.add(id);else customerBulkSelected.delete(id);syncCustomerBulkUi()}
function toggleCustomerBulkVisible(checked){if(!customerBulkMode)return;customerVisibleBulkIds().forEach(id=>checked?customerBulkSelected.add(id):customerBulkSelected.delete(id));document.querySelectorAll('[data-customer-bulk-check]').forEach(cb=>cb.checked=checked);syncCustomerBulkUi()}
function customerBulkHeader(){return customerBulkMode?'<th class="bulk-check-col"><input id="customerBulkAll" class="bulk-check" type="checkbox" title="בחר את כל השורות המוצגות" onchange="toggleCustomerBulkVisible(this.checked)"></th>':''}
function customerBulkCell(id){return customerBulkMode?`<td class="bulk-check-col"><input class="bulk-check" data-customer-bulk-check type="checkbox" ${customerBulkSelected.has(id)?'checked':''} aria-label="בחר שורה" onchange="toggleCustomerBulkRow('${esc(id)}',this.checked)"></td>`:''}
function customerBulkControls(){return `<div class="module-bulk-controls"><button class="btn small bulk-select-toggle ${customerBulkMode?'active':''}" onclick="toggleCustomerBulkMode()">${customerBulkMode?'סיום בחירה':'בחירה'}</button>${customerBulkMode?`<button id="customerBulkDelete" class="btn danger small bulk-delete-btn" onclick="deleteSelectedCustomerRows()" disabled>מחק נבחרים</button>`:''}</div>`}
function syncCustomerBulkUi(){if(!customerBulkMode)return;const valid=new Set(customerBulkSource().map(x=>x.id));[...customerBulkSelected].forEach(id=>{if(!valid.has(id))customerBulkSelected.delete(id)});const del=$('#customerBulkDelete');if(del){del.disabled=!customerBulkSelected.size;del.textContent=customerBulkSelected.size?`מחק ${customerBulkSelected.size}`:'מחק נבחרים'}const visible=customerVisibleBulkIds(),selectedVisible=visible.filter(id=>customerBulkSelected.has(id)).length,all=$('#customerBulkAll');if(all){all.checked=visible.length>0&&selectedVisible===visible.length;all.indeterminate=selectedVisible>0&&selectedVisible<visible.length}document.querySelectorAll('[data-customer-bulk-id]').forEach(row=>row.classList.toggle('bulk-selected-row',customerBulkSelected.has(row.dataset.customerBulkId)))}
function deleteSelectedCustomerRows(){const source=customerBulkSource(),valid=new Set(source.map(x=>x.id)),ids=[...customerBulkSelected].filter(id=>valid.has(id));if(!ids.length)return toast('לא נבחרו שורות למחיקה');const label=customerTab==='debts'?'חובות לקוחות':'רשומות מעקב הזמנות';if(!confirm(`למחוק ${ids.length} ${label} שנבחרו?\n\nהמחיקה תישמר בגיבוי ובסנכרון כמו כל שינוי אחר.`))return;const set=new Set(ids);if(customerTab==='debts')state.customerDebts=state.customerDebts.filter(x=>!set.has(x.id));else state.customerOrders=state.customerOrders.filter(x=>!set.has(x.id));customerBulkSelected.clear();scheduleSave(`${ids.length} ${label} נמחקו`);renderCustomers()}
function renderCustomers({resultsOnly=false}={}){const st=customerStats(),q=(customerSearch||'').trim();let body='';if(customerTab==='debts'){let rows=(state.customerDebts||[]).filter(d=>{const ds=customerDebtStatus(d);if(customerFilter==='all'&&ds.key==='closed')return false;if(customerFilter==='open'&&d.paid)return false;if(customerFilter==='invoice'&&!(d.paid&&!d.invoiceIssued))return false;if(customerFilter==='closed'&&ds.key!=='closed')return false;if(q&&!`${d.customerName||''} ${d.orderNumber||''} ${d.phone||''} ${d.note||''}`.includes(q))return false;return true}).sort((a,b)=>Number(b.amount||0)-Number(a.amount||0));body=`<div class="panel customer-work-panel"><div class="table-wrap module-table customer-work-table"><table class="customer-table ${customerBulkMode?'customer-bulk-table':''}"><thead><tr>${customerBulkHeader()}<th>לקוח</th><th>סכום</th><th>הזמנה</th><th>שולם</th><th>חשבונית יצאה</th><th>מצב</th><th>הערה</th><th></th></tr></thead><tbody>${rows.map(debtRow).join('')||`<tr><td colspan="${customerBulkMode?9:8}" class="empty">אין חובות המתאימים לסינון.</td></tr>`}</tbody></table></div></div>`}else{let rows=(state.customerOrders||[]).filter(o=>{if(customerOrderFilter==='mattress'&&!o.mattressMarked)return false;if(customerOrderFilter==='attention'&&!o.sourceAttention)return false;if(q&&!`${o.orderNumber||''} ${o.customerName||''} ${o.sourceMarkA||''} ${o.sourceMarkB||''} ${o.mattressRaw||''} ${o.note||''}`.includes(q))return false;return true}).sort((a,b)=>String(a.orderNumber||'').localeCompare(String(b.orderNumber||''),'he',{numeric:true}));body=`<div class="panel customer-work-panel"><div class="table-wrap module-table customer-work-table"><table class="customer-orders-table ${customerBulkMode?'customer-bulk-table':''}"><thead><tr>${customerBulkHeader()}<th>הזמנה</th><th>לקוח</th><th>סימון 1</th><th>סימון 2</th><th>מזרונים</th><th>הערה</th></tr></thead><tbody>${rows.map(customerOrderRow).join('')||`<tr><td colspan="${customerBulkMode?7:6}" class="empty">אין הזמנות המתאימות לסינון.</td></tr>`}</tbody></table></div></div>`}if(resultsOnly){const host=$('#customerSearchResults');if(host)host.innerHTML=body;syncCustomerBulkUi();return}const filters=customerTab==='debts'?`<div class="filters"><button class="chip-filter ${customerFilter==='all'?'active':''}" onclick="customerFilter='all';renderCustomers()">הכל</button><button class="chip-filter ${customerFilter==='open'?'active':''}" onclick="customerFilter='open';renderCustomers()">חוב פתוח</button><button class="chip-filter ${customerFilter==='invoice'?'active':''}" onclick="customerFilter='invoice';renderCustomers()">שולם בלי חשבונית</button><button class="chip-filter ${customerFilter==='closed'?'active':''}" onclick="customerFilter='closed';renderCustomers()">נסגר</button></div>`:`<div class="filters"><button class="chip-filter ${customerOrderFilter==='all'?'active':''}" onclick="customerOrderFilter='all';renderCustomers()">הכל</button><button class="chip-filter ${customerOrderFilter==='mattress'?'active':''}" onclick="customerOrderFilter='mattress';renderCustomers()">מזרונים</button><button class="chip-filter ${customerOrderFilter==='attention'?'active':''}" onclick="customerOrderFilter='attention';renderCustomers()">דורש תשומת לב</button></div>`;const sourceNote=customerTab==='orders'?`<div class="customer-summary-note">סימוני V / VV / VVV נשמרים כפי שהתקבלו, בלי להמציא להם משמעות עסקית שלא הוגדרה.</div>`:'';$('#main').innerHTML=`<div class="customers-view"><div class="module-toolbar customer-command"><div class="module-tabs"><button class="chip-filter ${customerTab==='debts'?'active':''}" onclick="setCustomerTab('debts')">חובות</button><button class="chip-filter ${customerTab==='orders'?'active':''}" onclick="setCustomerTab('orders')">מעקב הזמנות</button></div>${customerBulkControls()}<input class="customer-search" placeholder="${customerTab==='debts'?'חיפוש לקוח, הזמנה, טלפון או הערה…':'חיפוש הזמנה, לקוח או סימון…'}" value="${esc(customerSearch)}" oninput="customerSearch=this.value;renderCustomers({resultsOnly:true})">${filters}${customerTab==='debts'?'<button class="btn primary small customer-add-btn" onclick="openDebtModal()">+ חוב לקוח</button>':''}</div><div id="customerSearchResults">${body}</div><section class="customer-bottom-summary"><div class="customer-bottom-head"><div><h2>סיכום לקוחות</h2><p>הסיכום עבר לתחתית כדי להשאיר את שטח העבודה העליון לטבלה.</p></div></div><div class="customer-bottom-grid"><div><span>חוב פתוח</span><b class="badtext">${money(st.openTotal)}</b><small>${st.open} לקוחות</small></div><div><span>שולם · חסרה חשבונית</span><b class="warntext">${st.missingInvoice}</b><small>חשבונית עדיין לא נסגרה</small></div><div><span>נסגרו</span><b class="goodtext">${st.closed}</b><small>תשלום + חשבונית</small></div><div><span>מעקב הזמנות</span><b>${st.trackedOrders}</b><small>רשומות במעקב</small></div></div>${sourceNote}</section></div>`;mountViewLayout({sourceSelector:'.customers-view',headCount:1,className:'customers-view'});syncCustomerBulkUi()}
function customerOrderRow(o){const a=o.sourceMarkA?`<span class="source-marker">${esc(o.sourceMarkA)}</span>`:'—',b=o.sourceMarkB?`<span class="source-marker">${esc(o.sourceMarkB)}</span>`:'—';return `<tr data-customer-bulk-id="${esc(o.id)}" class="${o.sourceAttention?'source-attention':''} ${customerBulkSelected.has(o.id)?'bulk-selected-row':''}">${customerBulkCell(o.id)}<td><b>${esc(o.orderNumber||'—')}</b></td><td><b>${esc(o.customerName||'')}</b></td><td>${a}</td><td>${b}</td><td>${o.mattressMarked?'<span class="badge green">מזרונים</span>':'—'}</td><td><input class="inline-input" value="${esc(o.note||'')}" placeholder="הערה" onkeydown="if(event.key==='Enter')this.blur()" onblur="saveCustomerOrderNote('${esc(o.id)}',this)"></td></tr>`}
function saveCustomerOrderNote(id,el){const o=state.customerOrders.find(x=>x.id===id);if(!o)return;const v=el.value.trim();if((o.note||'')===v)return;o.note=v;o.updatedAt=new Date().toISOString();scheduleSave('הערת מעקב ההזמנה עודכנה')}
function debtToggle(d,field,label){const v=!!d[field];return `<div class="status-toggle binary" title="${esc(label)}"><button class="yes ${v?'active':''}" onclick="setCustomerFlag('${esc(d.id)}','${field}',true)">כן</button><button class="no ${!v?'active':''}" onclick="setCustomerFlag('${esc(d.id)}','${field}',false)">לא</button></div>`}
function debtRow(d){const s=customerDebtStatus(d);return `<tr data-customer-bulk-id="${esc(d.id)}" class="${s.key==='closed'?'row-closed':''} ${customerBulkSelected.has(d.id)?'bulk-selected-row':''}">${customerBulkCell(d.id)}<td><b>${esc(d.customerName)}</b>${d.phone?`<div class="customer-phone">${esc(d.phone)}</div>`:''}</td><td class="money badtext"><b>${money(d.amount)}</b></td><td>${esc(d.orderNumber||'—')}</td><td>${debtToggle(d,'paid','שולם')}</td><td>${debtToggle(d,'invoiceIssued','חשבונית יצאה')}</td><td><span class="badge ${s.cls}">${s.text}</span></td><td><input class="inline-input" value="${esc(d.note||'')}" placeholder="הערה" onkeydown="if(event.key==='Enter')this.blur()" onblur="saveDebtNote('${esc(d.id)}',this)"></td><td class="module-actions"><button class="icon-btn" title="עריכה" onclick="openDebtModal('${esc(d.id)}')">✎</button></td></tr>`}
function setCustomerFlag(id,field,value){const d=state.customerDebts.find(x=>x.id===id);if(!d||!['paid','invoiceIssued'].includes(field))return;if(d[field]===value)return;const now=new Date().toISOString();d[field]=value;d.updatedAt=now;if(field==='paid')d.paidAt=value?now:null;if(field==='invoiceIssued')d.invoiceIssuedAt=value?now:null;d.closedAt=d.paid&&d.invoiceIssued?(d.closedAt||now):null;scheduleSave('סטטוס חוב הלקוח עודכן');renderCustomers()}
function saveDebtNote(id,el){const d=state.customerDebts.find(x=>x.id===id);if(!d)return;const v=el.value.trim();if((d.note||'')===v)return;d.note=v;d.updatedAt=new Date().toISOString();scheduleSave('הערת הלקוח עודכנה')}
function openDebtModal(id=null){const d=id?state.customerDebts.find(x=>x.id===id):null;modal(d?'עריכת חוב לקוח':'חוב לקוח חדש',`<div class="form-grid"><div class="field"><label>שם לקוח</label><input id="dName" value="${esc(d?.customerName||'')}"></div><div class="field"><label>סכום חוב</label><input id="dAmount" class="number-input" type="number" step="1" min="0" value="${Number(d?.amount||0)||''}"></div><div class="field"><label>מספר הזמנה</label><input id="dOrder" value="${esc(d?.orderNumber||'')}"></div><div class="field"><label>טלפון</label><input id="dPhone" value="${esc(d?.phone||'')}"></div><div class="field"><label>שולם</label><select id="dPaid"><option value="false" ${!d?.paid?'selected':''}>לא</option><option value="true" ${d?.paid?'selected':''}>כן</option></select></div><div class="field"><label>חשבונית יצאה</label><select id="dInvoice"><option value="false" ${!d?.invoiceIssued?'selected':''}>לא</option><option value="true" ${d?.invoiceIssued?'selected':''}>כן</option></select></div><div class="field full"><label>הערה</label><textarea id="dNote">${esc(d?.note||'')}</textarea></div></div>`,`<button class="btn primary" onclick="saveDebt('${id||''}')">שמור</button>${d?`<button class="btn danger" onclick="deleteDebt('${esc(d.id)}')">מחק</button>`:''}<button class="btn" onclick="closeModal()">ביטול</button>`)}
function saveDebt(id=''){const name=$('#dName').value.trim(),amount=Math.max(0,Number($('#dAmount').value||0));if(!name)return toast('יש להזין שם לקוח');if(!amount)return toast('יש להזין סכום חוב');let d=id?state.customerDebts.find(x=>x.id===id):null;const paid=$('#dPaid').value==='true',invoiceIssued=$('#dInvoice').value==='true',now=new Date().toISOString();const row={...(d||{}),id:d?.id||uid('DEBT'),customerName:name,amount,orderNumber:$('#dOrder').value.trim(),phone:$('#dPhone').value.trim(),paid,invoiceIssued,note:$('#dNote').value.trim(),updatedAt:now,paidAt:paid?(d?.paidAt||now):null,invoiceIssuedAt:invoiceIssued?(d?.invoiceIssuedAt||now):null,closedAt:paid&&invoiceIssued?(d?.closedAt||now):null};if(d)Object.assign(d,row);else state.customerDebts.push(row);closeModal();scheduleSave(d?'חוב הלקוח עודכן':'חוב הלקוח נוסף');renderCustomers()}

function renderService({resultsOnly=false}={}){const q=(serviceSearch||'').trim();let rows=(state.serviceCalls||[]).filter(c=>{const st=serviceStatus(c);if(serviceFilter==='all'&&c.closed)return false;if(serviceFilter==='open'&&st.key!=='open')return false;if(serviceFilter==='follow'&&(!c.followUp||c.closed))return false;if(serviceFilter==='escalated'&&(!c.escalated||c.closed))return false;if(serviceFilter==='closed'&&!c.closed)return false;if(q&&!`${c.customerName||''} ${c.orderNumber||''} ${c.phone||''} ${c.address||''} ${c.description||''} ${c.note||''}`.includes(q))return false;return true}).sort((a,b)=>String(b.openedAt||'').localeCompare(String(a.openedAt||'')));const open=state.serviceCalls.filter(c=>!c.closed).length,follow=state.serviceCalls.filter(c=>c.followUp&&!c.closed).length,escalated=state.serviceCalls.filter(c=>c.escalated&&!c.closed).length,closed=state.serviceCalls.filter(c=>c.closed).length;const grid=rows.map(serviceCard).join('')||'<div class="empty module-empty">אין קריאות המתאימות לסינון.</div>';if(resultsOnly){const host=$('#serviceSearchResults');if(host)host.innerHTML=grid;syncServiceBulkUi();return}$('#main').innerHTML=`<section class="hero"><div><h1>קריאות שירות</h1><p>כל קריאה נשארת בתהליך ברור: פתוח → מעקב → נשלח / הוקפץ → נסגר.</p></div><div class="actions"><button class="btn primary" onclick="openServiceModal()">+ פתיחת קריאה</button></div></section><div class="module-toolbar service-toolbar"><input class="service-search" placeholder="חיפוש לקוח, הזמנה, טלפון או תוכן הקריאה…" value="${esc(serviceSearch)}" oninput="serviceSearch=this.value;renderService({resultsOnly:true})"><div class="filters"><button class="chip-filter ${serviceFilter==='all'?'active':''}" onclick="serviceFilter='all';renderService()">הכל</button><button class="chip-filter ${serviceFilter==='open'?'active':''}" onclick="serviceFilter='open';renderService()">פתוחות</button><button class="chip-filter ${serviceFilter==='follow'?'active':''}" onclick="serviceFilter='fol function serviceCard(c){const s=serviceStatus(c),selected=serviceBulkSelected.has(c.id);return `<article data-service-bulk-id="${esc(c.id)}" class="service-card ${c.closed?'closed':''} ${selected?'bulk-selected-card':''}">${serviceBulkMode?`<label class="card-bulk-select" title="בחר קריאת שירות"><input class="bulk-check" data-service-bulk-check type="checkbox" ${selected?'checked':''} onchange="toggleServiceBulkRow('${esc(c.id)}',this.checked)"></label>`:''}<div class="service-head"><div><div class="service-title">${esc(c.customerName)}</div><div class="service-meta">${c.orderNumber?`הזמנה ${esc(c.orderNumber)} · `:''}${esc(c.openedAt||'ללא תאריך')}</div></div><span class="badge ${s.cls}">${s.text}</span></div><div class="service-contact">${c.phone?`<span class="service-phone">☎ ${esc(c.phone)}</span>`:''}${c.address?`<span class="service-address">⌂ ${esc(c.address)}</span>`:''}</div><div class="service-description">${esc(c.description||'')}</div>${c.note?`<div class="service-note">${esc(c.note)}</div>`:''}<div class="workflow-row"><div class="workflow-actions">${serviceFlag(c,'followUp','מעקב')}${serviceFlag(c,'sent','נשלח')}${serviceFlag(c,'escalated','הקפצה')}${serviceFlag(c,'closed','נסגר')}</div><div class="service-card-actions"><button class="btn small service-email" onclick="openServiceGmail('${esc(c.id)}')">✉ מייל</button><button class="btn small service-edit" onclick="openServiceModal('${esc(c.id)}')">עריכה</button></div></div>${c.nextFollowUp?`<div class="card-foot"><span>מעקב הבא: ${esc(c.nextFollowUp)}</span></div>`:''}</article>`}

function inventoryCategoryNames(){return [...new Set(state.inventoryItems.filter(x=>x.active!==false).map(inventoryCategoryName))]}

function ensureInventoryCategoryOrder(name){name=String(name||'').trim()||'ללא קטגוריה';state.inventoryCategoryOrder=Array.isArray(state.inventoryCategoryOrder)?state.inventoryCategoryOrder:[];if(state.inventoryCategoryOrder.includes(name))return;const accessoriesIndex=state.inventoryCategoryOrder.indexOf('אביזרים');if(name!=='אביזרים'&&accessoriesIndex===state.inventoryCategoryOrder.length-1)state.inventoryCategoryOrder.splice(accessoriesIndex,0,name);else state.inventoryCategoryOrder.push(name)}
function openInventoryCategoryOrderModal(){inventoryCategoryOrderDraft=orderedInventoryCategoryNames();modal('סידור רשימת המחסן',`<div class="notice supplier-order-help">סדר את קטגוריות המלאי בגרירה או בחיצים. הסדר נשמר מקומית ובענן ומשפיע על רשימת המלאי. כברירת מחדל “אביזרים” נמצא בסוף.</div><div id="inventoryCategoryOrderList" class="supplier-order-list"></div>`,`<button class="btn primary" onclick="saveInventoryCategoryOrder()">שמור סדר</button><button class="btn" onclick="closeModal()">ביטול</button>`);renderInventoryCategoryOrderList()}

function moveInventoryCategoryOrder(encoded,delta){const name=decodeURIComponent(encoded),i=inventoryCategoryOrderDraft.indexOf(name),j=i+delta;if(i<0||j<0||j>=inventoryCategoryOrderDraft.length)return;[inventoryCategoryOrderDraft[i],inventoryCategoryOrderDraft[j]]=[inventoryCategoryOrderDraft[j],inventoryCategoryOrderDraft[i]];renderInventoryCategoryOrderList()}

function saveInventoryCategoryOrder(){const active=new Set(inventoryCategoryNames()),seen=new Set();state.inventoryCategoryOrder=inventoryCategoryOrderDraft.filter(name=>active.has(name)&&!seen.has(name)&&seen.add(name));for(const name of inventoryCategoryNames())if(!seen.has(name))state.inventoryCategoryOrder.push(name);closeModal();scheduleSave('סדר רשימת המחסן נשמר');if(currentView==='warehouse')renderWarehouse();else renderSettings()}
function itemEvents(itemId){return(state.inventoryEvents||[]).filter(e=>e.itemId===itemId)}
function incomingRemaining(e){if(!e||e.type!=='order'||e.cancelledAt||e.receivedAt)return 0;const total=Math.max(0,Number(e.quantity||0)),received=Math.max(0,Number(e.receivedQuantity||0));return Math.max(0,total-received)}
function inventoryStats(itemId){let onHand=0,incoming=0,reserved=0;for(const e of itemEvents(itemId)){const q=Number(e.quantity||0);if(['opening','receive'].includes(e.type))onHand+=q;else if(e.type==='adjust')onHand+=q;else if(e.type==='pickup')onHand-=q;else if(e.type==='order')incoming+=incomingRemaining(e);else if(e.type==='reserve'){if(e.pickedAt)onHand-=q;else if(!e.releasedAt)reserved+=q}}return{onHand,reserved,incoming,available:onHand-reserved,projected:onHand-reserved+incoming}}
function inventoryTotals(){let onHand=0,reserved=0,incoming=0,available=0;for(const i of state.inventoryItems.filter(x=>x.active!==false)){const s=inventoryStats(i.id);onHand+=s.onHand;reserved+=s.reserved;incoming+=s.incoming;available+=s.available}return{onHand,reserved,incoming,available}}

function inventoryCategoryGroups(){const groups=new Map();for(const i of state.inventoryItems.filter(x=>x.active!==false)){const name=inventoryCategoryName(i);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(i)}return orderedInventoryCategoryNames().filter(name=>groups.has(name)).map(name=>({name,items:groups.get(name).sort((a,b)=>a.name.localeCompare(b.name,'he'))}))}
function inventorySearchMatch(i,q){return !q||`${i.name||''} ${i.category||''} ${i.defaultLocation||''} ${i.note||''}`.includes(q)}
function inventoryGroupStats(items){return items.reduce((out,i)=>{const s=inventoryStats(i.id);out.onHand+=s.onHand;out.reserved+=s.reserved;out.available+=s.available;out.incoming+=s.incoming;return out},{onHand:0,reserved:0,available:0,incoming:0})}

function recognizedWarehouseLocations(raw){raw=String(raw||'').replace(/\s+/g,' ');return WAREHOUSE_LOCATIONS.filter(name=>name==='מקלט'?/מקלט/.test(raw):name==='מחסן קטן'?/מחסן\s*קטן/.test(raw):/מחסן\s*גדול/.test(raw))}
function inventoryLocationText(i){const values=[i?.defaultLocation||''];for(const e of itemEvents(i?.id)){if(['opening','receive','adjust'].includes(e.type)){if(e.location)values.push(e.location);if(e.receivedLocation)values.push(e.receivedLocation)}}return values.filter(Boolean).join(' / ')}
function inventoryItemLocations(i){const preferred=recognizedWarehouseLocations(i?.defaultLocation);if(preferred.length)return preferred;const physical=itemEvents(i?.id).filter(e=>['opening','receive','adjust'].includes(e.type)).sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')));for(const e of physical){const found=recognizedWarehouseLocations(e.receivedLocation||e.location);if(found.length)return found}return[]}

function inventoryCategoryDatalist(){const names=orderedInventoryCategoryNames().filter(x=>x!=='ללא קטגוריה');return `<datalist id="inventoryCategoryList">${names.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`}
function stockCard(i){const s=inventoryStats(i.id),selected=warehouseBulkSelected.has(i.id);return `<article data-stock-bulk-id="${esc(i.id)}" class="stock-row ${s.available<0?'stock-short':''} ${selected?'bulk-selected-card':''}">${warehouseBulkMode?`<label class="card-bulk-select" title="בחר פריט מלאי"><input class="bulk-check" data-stock-bulk-check type="checkbox" ${selected?'checked':''} onchange="toggleWarehouseBulkRow('${esc(i.id)}',this.checked)"></label>`:''}<div class="stock-row-main"><div class="stock-title">${esc(i.name)}</div><div class="stock-sub">${esc(inventoryCategoryName(i))}${i.defaultLocation?` · ${esc(i.defaultLocation)}`:''}</div></div><div class="stock-row-stats"><div class="stock-numbers"><div><span>במחסן</span><b>${num(s.onHand)}</b></div><div><span>שמור</span><b>${num(s.reserved)}</b></div><div><span>פנוי</span><b class="${s.available<0?'badtext':'goodtext'}">${num(s.available)}</b></div><div><span>בדרך</span><b>${num(s.incoming)}</b></div></div>${s.incoming?`<div class="projected">פנוי צפוי אחרי הגעה: <b>${num(s.projected)}</b></div>`:''}</div><div class="stock-row-actions"><button class="btn small" onclick="openInventoryEventModal('${esc(i.id)}','order')">הזמן מלאי</button><button class="btn small" onclick="openStockReceive('${esc(i.id)}')">קליטה למחסן</button><button class="btn small primary" onclick="openInventoryEventModal('${esc(i.id)}','reserve')">שמור ללקוח</button><button class="btn small" onclick="openStockAdjustmentModal('${esc(i.id)}')">התאם ספירה</button><button class="btn small" onclick="openInventoryItemModal('${esc(i.id)}')">עריכה</button></div></article>`}
function renderInventoryGroup(name,items,kind='category'){const q=(warehouseSearch||'').trim(),filtered=items.filter(i=>inventorySearchMatch(i,q));if(!filtered.length&&q)return'';const open=q||((kind==='location'?inventoryLocationOpen:inventoryCategoryOpen).has(name)),summary=inventoryGroupStats(filtered),encoded=encodeURIComponent(name),summaryHtml=kind==='location'?`<span>${filtered.length} פריטים</span>`:`<span>במחסן ${num(summary.onHand)}</span><span>פנוי ${num(summary.available)}</span>${summary.incoming?`<span>בדרך ${num(summary.incoming)}</span>`:''}`;return `<section class="inventory-group ${open?'open':''}"><button type="button" class="inventory-group-toggle" aria-expanded="${open?'true':'false'}" onclick="toggleInventoryGroup('${kind}','${esc(encoded)}')"><div class="inventory-group-title"><span class="inventory-group-arrow">›</span><div><div class="inventory-group-name">${esc(name)}</div><div class="inventory-group-count">${filtered.length} פריטים${kind==='category'&&filtered.length!==items.length?` מתוך ${items.length}`:''}</div></div></div><div class="inventory-group-summary">${summaryHtml}</div></button>${open?`<div class="inventory-group-body">${kind==='location'?renderLocationItems(filtered,name):`<div class="stock-list">${filtered.map(stockCard).join('')}</div>`}</div>`:''}</section>`}
function renderStockGrid(){const groups=inventoryCategoryGroups();const html=groups.map(g=>renderInventoryGroup(g.name,g.items,'category')).join('');return `<div class="inventory-groups ${warehouseBulkMode?'bulk-card-mode':''}">${html||'<div class="empty module-empty">אין פריטי מלאי.</div>'}</div>`}
function renderLocationItems(items,location){return `<div class="location-item-grid">${items.map(i=>{const s=inventoryStats(i.id),raw=inventoryLocationText(i);return `<div class="location-item"><div class="location-item-main"><b>${esc(i.name)}</b><div class="source">${esc(inventoryCategoryName(i))}${raw?` · מיקום רשום: ${esc(raw)}`:''}</div></div><div class="location-item-total"><span>סה״כ לפריט</span><b>${num(s.onHand)}</b></div></div>`}).join('')||`<div class="empty">אין כרגע פריטים עם מלאי ב${esc(location)}.</div>`}</div>`}
function renderWarehouseLocations(){const q=(warehouseSearch||'').trim(),physical=state.inventoryItems.filter(i=>i.active!==false&&inventoryStats(i.id).onHand>0),groups=WAREHOUSE_LOCATIONS.map(name=>({name,items:physical.filter(i=>inventoryItemLocations(i).includes(name))})),unclassified=physical.filter(i=>inventoryItemLocations(i).length===0&&inventorySearchMatch(i,q));return `<div class="notice inventory-location-intro">התצוגה ממיינת לפי המיקום הרשום בפריט ובתנועות המלאי. בכרטיסי המיקום מוצגת רשימת הפריטים; המספר ליד כל פריט הוא <b>סה״כ המלאי של אותו פריט</b>, משום שהנתונים הישנים אינם מפרידים כמות מדויקת בין כמה מיקומים.</div><div class="inventory-groups">${groups.map(g=>renderInventoryGroup(g.name,g.items,'location')).join('')}</div>${unclassified.length?`<div class="notice warn inventory-unclassified"><b>${unclassified.length} פריטים עם מלאי אינם משויכים בוודאות לאחד משלושת המיקומים.</b> לא בוצע ניחוש אוטומטי. אפשר לעדכן להם מיקום דרך עריכת הפריט: ${unclassified.map(i=>esc(i.name)).join(' · ')}</div>`:''}`}
function setWarehouseTab(tab){if(!['stock','incoming','reservations','orders','locations','history'].includes(tab)||tab===warehouseTab)return;warehouseTab=tab;warehouseBulkMode=false;warehouseBulkSelected.clear();renderWarehouse()}
function warehouseVisibleBulkIds(){return [...document.querySelectorAll('[data-stock-bulk-id]')].map(el=>el.dataset.stockBulkId).filter(Boolean)}
function toggleWarehouseBulkMode(){if(warehouseTab!=='stock'){warehouseTab='stock'}warehouseBulkMode=!warehouseBulkMode;warehouseBulkSelected.clear();renderWarehouse()}
function toggleWarehouseBulkRow(id,checked){if(!warehouseBulkMode||warehouseTab!=='stock'||!state.inventoryItems.some(x=>x.id===id&&x.active!==false))return;if(checked)warehouseBulkSelected.add(id);else warehouseBulkSelected.delete(id);syncWarehouseBulkUi()}
function toggleWarehouseBulkVisible(){if(!warehouseBulkMode)return;const ids=warehouseVisibleBulkIds(),allSelected=ids.length>0&&ids.every(id=>warehouseBulkSelected.has(id));ids.forEach(id=>allSelected?warehouseBulkSelected.delete(id):warehouseBulkSelected.add(id));syncWarehouseBulkUi()}
function warehouseBulkControls(){if(warehouseTab!=='stock')return'';return `<div class="warehouse-bulk-actions"><button class="btn small bulk-select-toggle ${warehouseBulkMode?'active':''}" onclick="toggleWarehouseBulkMode()">${warehouseBulkMode?'סיום בחירה':'בחירה'}</button>${warehouseBulkMode?`<button id="warehouseBulkAll" class="btn small bulk-select-all-btn" onclick="toggleWarehouseBulkVisible()">בחר הכל</button><button id="warehouseBulkDelete" class="btn danger small bulk-delete-btn" onclick="archiveSelectedInventoryItems()" disabled>הסר נבחרים</button>`:''}</div>`}
function syncWarehouseBulkUi(){if(!warehouseBulkMode||warehouseTab!=='stock')return;const valid=new Set(state.inventoryItems.filter(x=>x.active!==false).map(x=>x.id));[...warehouseBulkSelected].forEach(id=>{if(!valid.has(id))warehouseBulkSelected.delete(id)});const del=$('#warehouseBulkDelete');if(del){del.disabled=!warehouseBulkSelected.size;del.textContent=warehouseBulkSelected.size?`הסר ${warehouseBulkSelected.size}`:'הסר נבחרים'}const visible=warehouseVisibleBulkIds(),all=visible.length>0&&visible.every(id=>warehouseBulkSelected.has(id)),allBtn=$('#warehouseBulkAll');if(allBtn)allBtn.textContent=all?'בטל הכל':'בחר הכל';document.querySelectorAll('[data-stock-bulk-id]').forEach(card=>{const selected=warehouseBulkSelected.has(card.dataset.stockBulkId);card.classList.toggle('bulk-selected-card',selected);const cb=card.querySelector('[data-stock-bulk-check]');if(cb)cb.checked=selected})}
function archiveSelectedInventoryItems(){const items=[...warehouseBulkSelected].map(id=>state.inventoryItems.find(x=>x.id===id&&x.active!==false)).filter(Boolean);if(!items.length)return toast('לא נבחרו פריטי מלאי להסרה');const blocked=items.filter(i=>{const st=inventoryStats(i.id);return Math.abs(st.onHand)>=1e-9||Math.abs(st.incoming)>=1e-9||Math.abs(st.reserved)>=1e-9});if(blocked.length){const names=blocked.slice(0,4).map(i=>i.name).join(' · ');return alert(`לא ניתן להסיר ${blocked.length} מהפריטים שנבחרו, כי יש עליהם מלאי, מלאי בדרך או שמירה פעילה.\n\n${names}${blocked.length>4?' · …':''}\n\nלא הוסר אף פריט.`)}if(!confirm(`להסיר ${items.length} פריטים מרשימת המלאי הפעילה?\n\nיומן התנועות ההיסטורי של כל פריט יישמר, בדיוק כמו בהסרת פריט יחיד.`))return;const now=new Date().toISOString();items.forEach(i=>{i.active=false;i.archivedAt=now;i.updatedAt=now});warehouseBulkSelected.clear();warehouseBulkMode=false;scheduleSave(`${items.length} פריטי מלאי הוסרו מהקטלוג הפעיל`);renderWarehouse()}
function renderWarehouse({resultsOnly=false}={}){const content=warehouseTab==='stock'?renderStockGrid():warehouseTab==='incoming'?renderIncomingList():warehouseTab==='reservations'?renderReservationList():warehouseTab==='orders'?renderWarehouseOrders():warehouseTab==='locations'?renderWarehouseLocations():renderInventoryHistory();if(resultsOnly){const host=$('#warehouseSearchResults');if(host)host.innerHTML=content;if(warehouseTab==='stock')syncWarehouseBulkUi();return}const totals=inventoryTotals();$('#main').innerHTML=`<section class="hero"><div><h1>מחסן ומלאי</h1><p>כל שינוי נשמר כאירוע: מלאי קיים, הזמנה בדרך, קליטה, שמירה ללקוח, איסוף והתאמת ספירה. כך הכמות הנוכחית ניתנת לביקורת בכל רגע.</p></div><div class="actions"><button class="btn" onclick="openInventoryItemModal()">+ פריט חדש</button>${warehouseBulkControls()}<button class="btn primary" onclick="openWarehouseOrderModal()">+ הזמנת לקוח</button></div></section><div class="module-toolbar"><input class="grow" placeholder="חיפוש פריט, לקוח, מיקום או הזמנה…" value="${esc(warehouseSearch)}" oninput="warehouseSearch=this.value;renderWarehouse({resultsOnly:true})"><div class="module-tabs"><button class="chip-filter ${warehouseTab==='stock'?'active':''}" onclick="setWarehouseTab('stock')">מלאי</button><button class="chip-filter ${warehouseTab==='incoming'?'active':''}" onclick="setWarehouseTab('incoming')">בדרך</button><button class="chip-filter ${warehouseTab==='reservations'?'active':''}" onclick="setWarehouseTab('reservations')">שמור ללקוחות</button><button class="chip-filter ${warehouseTab==='orders'?'active':''}" onclick="setWarehouseTab('orders')">הזמנות מזרונים</button><button class="chip-filter ${warehouseTab==='locations'?'active':''}" onclick="setWarehouseTab('locations')">מחסן</button><button class="chip-filter ${warehouseTab==='history'?'active':''}" onclick="setWarehouseTab('history')">יומן תנועות</button></div></div><div id="warehouseSearchResults">${content}</div><section class="module-bottom-summary"><div class="kpis module-kpis"><div class="kpi"><div class="label">במחסן</div><div class="value">${num(totals.onHand)}</div><div class="sub">יחידות פיזיות</div></div><div class="kpi"><div class="label">שמור ללקוחות</div><div class="value warntext">${num(totals.reserved)}</div></div><div class="kpi"><div class="label">פנוי עכשיו</div><div class="value ${totals.available<0?'badtext':'goodtext'}">${num(totals.available)}</div></div><div class="kpi"><div class="label">בדרך</div><div class="value">${num(totals.incoming)}</div></div></div></section>`;mountViewLayout({headCount:2,className:'warehouse-view-shell'});if(warehouseTab==='stock')syncWarehouseBulkUi()}
function renderIncomingList(){const q=(warehouseSearch||'').trim();const rows=state.inventoryEvents.filter(e=>incomingRemaining(e)>0).map(e=>({...e,remaining:incomingRemaining(e),item:state.inventoryItems.find(i=>i.id===e.itemId)})).filter(x=>!q||`${x.item?.name||''} ${x.note||''} ${x.location||''}`.includes(q));return `<div class="panel"><div class="simple-list">${rows.map(x=>`<div class="list-row"><div><b>${esc(x.item?.name||'פריט לא ידוע')}</b><div class="source">${num(x.remaining)} יחידות בדרך${Number(x.receivedQuantity||0)>0?` · נקלטו ${num(x.receivedQuantity)} מתוך ${num(x.quantity)}`:''}${x.note?` · ${esc(x.note)}`:''}</div></div><div class="list-actions"><span class="badge yellow">בדרך</span><button class="btn small primary" onclick="receiveIncoming('${esc(x.id)}')">הגיע למחסן</button><button class="btn small" onclick="editInventoryEvent('${esc(x.id)}')">עריכה</button><button class="btn small danger" onclick="cancelIncoming('${esc(x.id)}')">בטל יתרה</button></div></div>`).join('')||'<div class="empty">אין כרגע מלאי בדרך.</div>'}</div></div>`}
function renderReservationList(){const q=(warehouseSearch||'').trim();const rows=state.inventoryEvents.filter(e=>e.type==='reserve'&&!e.pickedAt&&!e.releasedAt).map(e=>({...e,item:state.inventoryItems.find(i=>i.id===e.itemId)})).filter(x=>!q||`${x.customerName||''} ${x.item?.name||''} ${x.note||''} ${x.location||''}`.includes(q));return `<div class="panel"><div class="simple-list">${rows.map(x=>`<div class="list-row"><div><b>${esc(x.customerName||'לקוח')}</b><div>${esc(x.item?.name||'פריט')} · ${num(x.quantity)} יחידות</div><div class="source">${x.location?`מיקום: ${esc(x.location)}`:''}${x.note?` · ${esc(x.note)}`:''}</div></div><div class="list-actions"><span class="badge yellow">שמור</span><button class="btn small primary" onclick="pickupReservation('${esc(x.id)}')">נאסף</button><button class="btn small" onclick="releaseReservation('${esc(x.id)}')">בטל שמירה</button></div></div>`).join('')||'<div class="empty">אין כרגע פריטים שמורים ללקוחות.</div>'}</div></div>`}
function inventoryEventView(e){const item=state.inventoryItems.find(i=>i.id===e.itemId),q=Number(e.quantity||0),when=e.pickedAt||e.releasedAt||e.receivedAt||e.cancelledAt||e.updatedAt||e.createdAt||'';let label='תנועה',cls='',effect='';if(e.type==='opening'){label='יתרת פתיחה';cls='green';effect=`+${num(q)}`}else if(e.type==='receive'){label='קליטה למחסן';cls='green';effect=`+${num(q)}`}else if(e.type==='adjust'){label='התאמת מלאי';cls=q<0?'red':'green';effect=`${q>0?'+':''}${num(q)}`}else if(e.type==='order'){const received=Math.max(0,Number(e.receivedQuantity||0)),remaining=incomingRemaining(e);if(e.receivedAt){label='הזמנה שהתקבלה';cls='green';effect=num(q)}else if(e.cancelledAt){label=received>0?'יתרת הזמנה בוטלה':'הזמנה שבוטלה';cls='red';effect=received>0?`${num(received)} נקלטו`:'0'}else if(received>0){label='הזמנה בדרך · נקלט חלקית';cls='yellow';effect=`${num(remaining)} בדרך`}else{label='הזמנה בדרך';cls='yellow';effect=num(q)}}else if(e.type==='reserve'){if(e.pickedAt){label='נאסף ע״י לקוח';cls='green';effect=`-${num(q)}`}else if(e.releasedAt){label='שמירה בוטלה';cls='';effect='0'}else{label='שמור ללקוח';cls='yellow';effect='0'}}else if(e.type==='pickup'){label='איסוף (נתון ישן)';cls='green';effect=`-${num(q)}`}else if(e.type==='release'){label='ביטול שמירה (נתון ישן)';effect='0'}return{e,item,label,cls,effect,when}}
function renderInventoryHistory(){const q=(warehouseSearch||'').trim();const rows=(state.inventoryEvents||[]).map(inventoryEventView).filter(x=>!q||`${x.item?.name||''} ${x.e.customerName||''} ${x.e.location||''} ${x.e.note||''} ${x.label}`.includes(q)).sort((a,b)=>String(b.when).localeCompare(String(a.when)));return `<div class="panel"><div class="inventory-history">${rows.map(x=>`<div class="history-row"><div class="history-main"><b>${esc(x.item?.name||'פריט לא ידוע')}</b><div class="source">${x.e.customerName?`${esc(x.e.customerName)} · `:''}${x.e.location?`${esc(x.e.location)} · `:''}${x.e.note?esc(x.e.note):''}</div></div><span class="badge ${x.cls}">${esc(x.label)}</span><b class="history-effect ${String(x.effect).startsWith('-')?'badtext':String(x.effect).startsWith('+')?'goodtext':''}">${esc(x.effect)}</b><span class="source history-date">${esc(x.when?String(x.when).slice(0,10):'')}</span></div>`).join('')||'<div class="empty">אין תנועות מלאי.</div>'}</div></div>`}
function warehouseStatusLabel(o){return({to_order:['להזמין','red'],ordered:['הוזמן','yellow'],direct:['הוזמן ישירות','yellow'],arrived:['הגיע','green'],picked:['נאסף','green']}[o.status]||['פתוח','yellow'])}
function renderWarehouseOrders(){const q=(warehouseSearch||'').trim();const rows=state.warehouseOrders.filter(o=>!q||`${o.customerName||''} ${o.phone||''} ${o.details||''} ${o.location||''} ${o.note||''}`.includes(q)).sort((a,b)=>Number(a.status==='picked')-Number(b.status==='picked'));return `<div class="warehouse-order-list">${rows.map(o=>{const st=warehouseStatusLabel(o);return `<article class="warehouse-order-row ${o.status==='picked'?'closed':''}"><div class="warehouse-order-main"><div class="service-head"><div><div class="service-title">${esc(o.customerName)}</div><div class="service-meta">${o.phone?esc(o.phone):'הזמנת מחסן'}${o.source?.row?` · אקסל ${esc(o.source.row)}`:''}</div></div><span class="badge ${st[1]}">${st[0]}</span></div>${o.location?`<div class="warehouse-order-location">מיקום: ${esc(o.location)}</div>`:''}</div><div class="warehouse-order-details">${esc(o.details||'')}</div><div class="warehouse-order-actions"><div class="warehouse-status-actions warehouse-flow"><button class="workflow-btn ${o.status==='to_order'?'active':''}" onclick="setWarehouseOrderStatus('${esc(o.id)}','to_order')">להזמין</button><button class="workflow-btn ${['ordered','direct'].includes(o.status)?'active':''}" onclick="setWarehouseOrderStatus('${esc(o.id)}','ordered')">הוזמן</button><button class="workflow-btn ${o.status==='arrived'?'active':''}" onclick="setWarehouseOrderStatus('${esc(o.id)}','arrived')">הגיע</button><button class="workflow-btn ${o.status==='picked'?'active':''}" onclick="setWarehouseOrderStatus('${esc(o.id)}','picked')">נאסף</button></div><button class="btn small warehouse-order-edit" onclick="openWarehouseOrderModal('${esc(o.id)}')">עריכה</button></div></article>`}).join('')||'<div class="empty module-empty">אין הזמנות מזרונים.</div>'}</div>`}
function openInventoryItemModal(id=null){const i=id?state.inventoryItems.find(x=>x.id===id):null,stats=i?inventoryStats(i.id):null,canArchive=!!i&&Math.abs(stats.onHand)<1e-9&&Math.abs(stats.incoming)<1e-9&&Math.abs(stats.reserved)<1e-9;modal(i?'עריכת פריט מלאי':'פריט מלאי חדש',`<div class="form-grid"><div class="field full"><label>שם פריט</label><input id="invName" value="${esc(i?.name||'')}"></div><div class="field"><label>קטגוריה</label><input id="invCategory" list="inventoryCategoryList" placeholder="בחר קטגוריה קיימת או כתוב חדשה" value="${esc(i?.category||'')}">${inventoryCategoryDatalist()}</div><div class="field"><label>מיקום ברירת מחדל</label><input id="invLocation" list="warehouseLocationList" placeholder="מחסן גדול / מקלט / מחסן קטן" value="${esc(i?.defaultLocation||'')}">${inventoryLocationDatalist()}</div><div class="field full"><label>הערה</label><textarea id="invNote">${esc(i?.note||'')}</textarea></div>${!i?'<div class="field"><label>כמות שכבר קיימת במחסן</label><input id="invOpening" type="number" min="0" step="1" value="0"></div>':`<div class="field full"><div class="inventory-delete-note ${canArchive?'':'badtext'}">${canArchive?'ניתן להסיר את הפריט מהקטלוג: אין במלאי, אין בדרך ואין שמירה פעילה.':'לא ניתן להסיר כרגע: יש לפריט מלאי, הזמנה בדרך או שמירה פעילה.'}</div></div>`}</div>`,`<button class="btn primary" onclick="saveInventoryItem('${id||''}')">שמור</button>${i?`<button class="btn danger" ${canArchive?'':'disabled'} onclick="archiveInventoryItem('${esc(i.id)}')">הסר פריט מהקטלוג</button>`:''}<button class="btn" onclick="closeModal()">ביטול</button>`)}
function saveInventoryItem(id=''){const name=$('#invName').value.trim(),category=$('#invCategory').value.trim();if(!name)return toast('יש להזין שם פריט');if(!category)return toast('יש לבחור או להזין קטגוריה');let i=id?state.inventoryItems.find(x=>x.id===id):null;const opening=i?0:Number($('#invOpening')?.value||0);if(!i&&(!Number.isInteger(opening)||opening<0))return toast('כמות פתיחה חייבת להיות מספר שלם ולא שלילי');if(i){i.name=name;i.category=category;i.defaultLocation=$('#invLocation').value.trim();i.note=$('#invNote').value.trim();i.updatedAt=new Date().toISOString()}else{i={id:uid('INV'),name,category,defaultLocation:$('#invLocation').value.trim(),note:$('#invNote').value.trim(),active:true,createdAt:new Date().toISOString()};state.inventoryItems.push(i);if(opening)state.inventoryEvents.push({id:uid('INEV'),itemId:i.id,type:'opening',quantity:opening,customerName:'',location:i.defaultLocation,note:'יתרת פתיחה בעת יצירת הפריט',createdAt:new Date().toISOString()})}ensureInventoryCategoryOrder(category);closeModal();scheduleSave('פריט המלאי נשמר');renderWarehouse()}

function deleteSelectedStickyNotes(){const valid=new Set(state.notes.map(x=>x.id)),ids=[...notesBulkSelected].filter(id=>valid.has(id));if(!ids.length)return toast('לא נבחרו פתקים למחיקה');if(!confirm(`למחוק ${ids.length} פתקים שנבחרו?`))return;const set=new Set(ids);state.notes=state.notes.filter(x=>!set.has(x.id));notesBulkSelected.clear();scheduleSave(`${ids.length} פתקים נמחקו`);renderNotes()}
function stickyNoteCard(note){const selected=notesBulkSelected.has(note.id);return `<article class="sticky-note ${selected?'bulk-selected-card':''}" data-note-id="${esc(note.id)}">${notesBulkMode?`<label class="sticky-note-select" title="בחר פתק"><input type="checkbox" data-note-bulk-check ${selected?'checked':''} onchange="toggleNotesBulkRow('${esc(note.id)}',this.checked)"></label>`:''}<div class="sticky-note-paper"><textarea aria-label="תוכן הפתק" placeholder="כתוב כאן הערה או תזכורת…" oninput="updateStickyNote('${esc(note.id)}',this)">${esc(note.content)}</textarea></div><footer class="sticky-note-footer"><span class="sticky-note-date" data-note-date>${esc(noteDisplayDate(note))}</span><button class="btn danger small" onclick="deleteStickyNote('${esc(note.id)}')">מחק</button></footer></article>`}
function renderNotes(){const rows=noteSortRows();$('#main').innerHTML=`<div class="notes-view"><section class="hero notes-hero"><div><h1>הערות</h1><p>פתקים מהירים לתזכורות ומעקב. כל שינוי נשמר יחד עם נתוני המערכת ומסתנכרן לענן כשסנכרון פעיל.</p></div><div class="notes-actions"><button class="btn primary" onclick="addStickyNote()">+ פתק חדש</button>${notesBulkControls()}</div></section><div class="notes-grid">${rows.map(stickyNoteCard).join('')||`<div class="notes-empty"><b>אין עדיין פתקים</b>לחץ על „פתק חדש” כדי לרשום תזכורת ראשונה.</div>`}</div></div>`;mountViewLayout({sourceSelector:'.notes-view',headCount:1,className:'notes-view'});requestAnimationFrame(()=>{resizeAllStickyNotes();syncNotesBulkUi()})}

function renderSettings(){$('#main').innerHTML=`<section class="hero"><div><h1>הגדרות, ענן וגיבוי</h1><p>נתוני ההזמנות והקופה נשמרים במאגרים נפרדים; רשימת הצ'קים משותפת בין המערכות, ו„מאזן קופה נטו” נקרא מנתוני הקופה בענן לצורך תצוגה וחישוב בלבד.</p></div></section><div class="settings-grid">
<div class="settings-card"><h3>Supabase — מאגר נפרד</h3><div class="notice">ניהול ההזמנות עצמו: <b>order_management_documents</b> ו־<b>order_management_document_backups</b>, דרך <b>save_order_management_document</b>.<br>טאב הצ'קים קורא ומעדכן את <b>shared_checks_documents/main</b> דרך <b>save_shared_checks_document</b>; הצ'קים אינם נשמרים עוד כעותק פעיל במסמך ההזמנות או במסמך הקופה. כרטיס „מאזן קופה נטו” קורא את נתוני הקופה ואת הצ'קים המשותפים לחישוב בלבד ואינו מוסיף כתיבה שלהם מניהול ההזמנות.</div><p>לפני החיבור הראשון יש להריץ פעם אחת את <b>supabase/setup.sql</b> של ניהול ההזמנות. לפני מעבר הייצור יש להריץ את מיגרציית <b>supabase/shared/cutover.sql</b> המצורפת, ורק אחריה להעלות את שתי גרסאות האתר החדשות.</p><div class="settings-row"><button class="btn primary" onclick="enableCloud()">הפעל ענן והעלה</button><button class="btn" onclick="openCloud()">פתח מהענן</button><button class="btn danger" onclick="logoutCloud()">התנתק</button></div><p>סטטוס: ${cloudEnabled()?'פעיל':'לא פעיל'}</p></div>
<div class="settings-card supplier-settings-card"><h3>ניהול ספקים</h3><p>הוספה, עריכה וסידור ספקים מרוכזים כאן כדי להשאיר את כרטיס הספק פנוי לעבודה השוטפת.</p><div class="settings-row"><button class="btn primary" onclick="openSupplierModal()">+ הוספת ספק</button><button class="btn" onclick="openSupplierOrderModal()">סידור ספקים</button></div><div class="supplier-edit-control"><label for="settingsSupplierEdit">בחירת ספק לעריכה</label><div class="supplier-edit-picker"><select id="settingsSupplierEdit" aria-label="בחר ספק לעריכה">${orderedSuppliers().map(sp=>`<option value="${esc(sp.id)}" ${sp.id===currentSupplierId?'selected':''}>${esc(sp.name)}</option>`).join('')}</select><button class="btn" onclick="openSelectedSupplierEditor()">עריכת ספק</button></div></div><p>${state.suppliers.length} ספקים פעילים · הסדר בתפריט הספקים נשמר לפי הסדר שהוגדר ב„סידור ספקים”.</p></div>
<div class="settings-card"><h3>סידור רשימת המחסן</h3><p>קובע את סדר קטגוריות המלאי בתצוגת המחסן. הסדר נשמר גם בענן ובגיבויים; קטגוריות חדשות מצטרפות בלי לשבור את הסדר הקיים.</p><div class="settings-row"><button class="btn" onclick="openInventoryCategoryOrderModal()">סידור קטגוריות במחסן</button></div><p>${orderedInventoryCategoryNames().length} קטגוריות פעילות · “אביזרים” מוגדר כברירת מחדל בסוף הרשימה.</p></div>
<div class="settings-card"><h3>שמירה מקומית וגיבויים</h3><p>כל שינוי נשמר קודם בדפדפן ומגובה גם ב־IndexedDB, והענן פועל בנפרד. תיקיית המחשב היא שכבת גיבוי נוספת בלבד: אם הדפדפן דורש אישור מחדש, העבודה והשמירה בדפדפן ובענן ממשיכות ללא תלות בה. קובץ העבודה נכתב אל <b>data/${DATA_FILE}</b>; גיבוי אוטומטי בתיקיית <b>backups</b> נוצר לכל היותר פעם ב־12 שעות ורק כשהנתונים השתנו.</p><div class="settings-row"><button class="btn" onclick="chooseFolder()">${dirHandle?'החלף תיקייה':'חבר תיקייה'}</button>${dirHandle&&dirPermission!=='granted'?'<button class="btn primary" onclick="activateSavedFolder()">אשר גישה מחדש</button>':''}<button class="btn" onclick="backupToFolder()">גיבוי לתיקייה</button><button class="btn" onclick="exportJson()">ייצא JSON</button><button class="btn" onclick="beginJsonRestore()">שחזר מ־JSON</button><button class="btn" onclick="exportCsv()">ייצא CSV</button></div><p>${dirHandle?`תיקייה זכורה: ${esc(dirHandle.name)} · ${dirPermission==='granted'&&!folderLastError?'גישה פעילה':folderLastError?`שגיאת גיבוי: ${esc(folderLastError)}`:'ממתינה לאישור דפדפן — אין השפעה על שמירת הדפדפן והענן'}`:'לא חוברה תיקייה; השמירה בדפדפן ובענן ממשיכה כרגיל.'}</p></div></div>`;mountViewLayout({headCount:1,className:'settings-view-shell'})}
function switchView(view){currentView=view;supplierBulkMode=false;supplierMoveTargetId=null;supplierBulkSelected.clear();customerBulkMode=false;customerBulkSelected.clear();serviceBulkMode=false;serviceBulkSelected.clear();warehouseBulkMode=false;warehouseBulkSelected.clear();notesBulkMode=false;notesBulkSelected.clear();if(currentView==='supplier'){if(!currentSupplierId)currentSupplierId=state.suppliers[0]?.id;supplierYearView='current'}searchText='';render()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
document.addEventListener('click',e=>{const menu=$('#supplierMenu');if(menu&&!menu.contains(e.target))closeSupplierMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSupplierMenu()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&loadSession())setTimeout(pollSharedChecks,120)});
window.addEventListener('online',()=>{if(cloudEnabled()){setCloud('ענן: חזרה רשת…');setTimeout(()=>{const resume=cloudHasLocalWork()?requestCloudSave('שינויים ממתינים סונכרנו'):Promise.resolve(true);resume.then(()=>cloudPoll())},250)}else if(loadSession())setTimeout(pollSharedChecks,300)});window.addEventListener('offline',()=>{if(cloudEnabled())setCloud('ענן: אופליין','offline')});
window.addEventListener('pagehide',()=>{if(!primaryTab)return;const ok=localSnapshot();if(cloudEnabled()&&ok&&cloudHasLocalWork())markCloudPending();if(loadSession()&&checksHaveLocalWork())markChecksPending()});
(async function boot(){await acquirePrimaryTabLock();try{await requestPersistentBrowserStorage()}catch(e){console.error(e)}try{await restoreBrowserStateFallback()}catch(e){console.error(e)}try{dirHandle=await loadDirHandle();if(dirHandle)await refreshDirPermission(false);else syncFolderAccessButton()}catch(e){console.error(e);syncFolderAccessButton()}if(!primaryTab){setCloud('ענן: לשונית משנית','offline');render({supplierScrollMode:'end'});showSecondaryTabGuard();return}try{lastCloudState=JSON.parse(localStorage.getItem(CLOUD_BASE_KEY)||'null')}catch(e){}const pending=loadCloudPendingState();if(pending){state=normalizeState(clone(pending));localGeneration=Math.max(localGeneration,1);cloudSaveRequested=true}else if(cloudEnabled()&&lastCloudState&&!sameOrderCloudData(state,lastCloudState)){localGeneration=Math.max(localGeneration,1);cloudSaveRequested=true;markCloudPending()}else if(cloudEnabled()&&!lastCloudState&&hasMeaningfulLocalData(state)){localGeneration=Math.max(localGeneration,1);cloudSaveRequested=true;markCloudPending()}if(checksPendingExists()){checksGeneration=Math.max(checksGeneration,1);checksSaveRequested=true}if(cloudEnabled()&&navigator.onLine){try{await openCloud({renderAfter:false})}catch(e){console.error(e);if(folderBackupAvailable())try{await maybeCreateAutomaticFolderBackup(prepareState())}catch(be){console.error(be)}}}else{if(cloudEnabled()&&!navigator.onLine)setCloud('ענן: אופליין','offline');if(loadSession()&&navigator.onLine)try{await syncSharedChecksFromCloud({quiet:true,required:true});await refreshKupaReadout({force:true})}catch(e){console.error(e)}if(folderBackupAvailable())try{await maybeCreateAutomaticFolderBackup(prepareState())}catch(e){console.error(e)}}render({supplierScrollMode:'end'});syncFolderAccessButton();setSave('מקומי: שמור','',folderSaveTitle());})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error));}
</script>
</body></html>
